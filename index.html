<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FrotaPro - Gestão de Frota Operacional</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080c14',
                        sidebarBg: '#0f172a',
                        cardBg: '#131b2e',
                        accentBlue: '#2563eb'
                    }
                }
            }
        }
    </script>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#080c14] text-slate-100 font-sans h-screen overflow-hidden flex flex-col">

    <!-- Notification Modal Box -->
    <div id="notificationModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-md p-4 hidden">
        <div class="w-full max-w-md bg-[#131b2e] border border-slate-700/80 rounded-2xl p-6 shadow-2xl">
            <div class="flex items-center space-x-3 mb-3">
                <div id="notifIcon" class="p-2 rounded-xl bg-blue-500/20 text-blue-400">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <h3 id="notifTitle" class="text-lg font-bold text-white">Aviso</h3>
            </div>
            <p id="notifMessage" class="text-slate-300 mb-6 text-sm leading-relaxed">Mensagem aqui...</p>
            <div class="flex justify-end">
                <button onclick="closeNotification()" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-all shadow-lg shadow-blue-600/30">
                    Entendido
                </button>
            </div>
        </div>
    </div>

    <div class="flex h-screen overflow-hidden">
        <!-- SIDEBAR -->
        <aside class="w-64 md:w-68 bg-sidebarBg border-r border-slate-800/80 flex flex-col justify-between shrink-0 select-none shadow-2xl overflow-y-auto">
            <div>
                <div class="p-6 flex items-center space-x-3 border-b border-slate-800/60">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-blue-600 to-indigo-700 flex items-center justify-center font-bold text-white shadow-lg shadow-blue-600/40 text-xl tracking-wider">
                        FP
                    </div>
                    <div>
                        <h1 class="font-bold text-lg text-white tracking-wide">FrotaPro</h1>
                        <p class="text-xs text-blue-400 font-medium">Gestão Operacional</p>
                    </div>
                </div>

                <nav class="p-4 space-y-1.5" id="navTabs">
                    <button data-tab="dashboard" class="nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/30">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
                        <span>Dashboard</span>
                    </button>
                    <button data-tab="veiculos" class="nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                        <span>Veículos / Viaturas</span>
                    </button>
                    <button data-tab="diario" class="nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                        <span>Diário de Bordo</span>
                    </button>
                    <button data-tab="checklist" class="nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                        <span>Checklist Saída</span>
                    </button>
                    <button data-tab="copiarPlanilha" class="nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>
                        <span>Colar de Planilha</span>
                    </button>
                    <button data-tab="abastecimentos" class="nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <span>Abastecimentos</span>
                    </button>
                    <button data-tab="manutencoes" class="nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/></svg>
                        <span>Manutenções</span>
                    </button>
                </nav>
            </div>

            <div class="p-4 border-t border-slate-800/80 bg-slate-900/40">
                <div class="w-full flex items-center justify-between p-3 rounded-xl bg-slate-800/90 border border-slate-700/60 text-xs shadow-inner">
                    <div class="flex items-center space-x-2">
                        <span id="dbIndicator" class="w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse"></span>
                        <span id="dbIndicatorText" class="font-semibold text-slate-200">Sem Conexão DB</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN VIEW -->
        <main class="flex-1 flex flex-col overflow-hidden bg-[#080c14]">
            <header class="h-20 bg-sidebarBg/90 backdrop-blur-md border-b border-slate-800 px-8 flex items-center justify-between shrink-0 shadow-lg">
                <h2 id="pageTitle" class="text-xl font-bold tracking-tight text-white">Dashboard Operacional</h2>
                <div id="actionButtonContainer"></div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 md:p-8" id="mainContent"></div>
        </main>
    </div>

    <!-- DYNAMIC FORM MODAL -->
    <div id="dynamicModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 backdrop-blur-md p-4 hidden">
        <div class="w-full max-w-lg bg-[#131b2e] border border-slate-700/80 rounded-2xl p-6 shadow-2xl">
            <h3 id="modalTitle" class="text-xl font-bold text-white mb-4">Novo Registro</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- SCRIPT DE SEGURANÇA (CAPTURA ERROS DE SINTAXE) -->
    <script>
        window.addEventListener('error', function(e) {
            const main = document.getElementById('mainContent');
            if (main && main.innerHTML.trim() === '') {
                main.innerHTML = '<div class="p-8"><div class="p-6 bg-red-900/20 border border-red-500 rounded-xl"><h3 class="text-red-400 font-bold text-lg mb-2">Erro de Código Detectado</h3><p class="text-slate-300 mb-2">Ocorreu um erro no arquivo. Verifique se você copiou as chaves do Supabase corretamente e não apagou as aspas duplas ("").</p><code class="text-xs text-red-300">' + e.message + '</code></div></div>';
            }
        });
    </script>

    <script>
        // ==========================================
        // INTEGRAÇÃO AUTOMÁTICA (COLOQUE SUAS CHAVES AQUI)
        // ==========================================
        const AUTO_SUPABASE_URL = "https://tcxomjkrukpzsfpgishj.supabase.co"; // Ex: "https://xyz.supabase.co"
        const AUTO_SUPABASE_KEY = "sb_publishable__bq6-fRbGLJ7Mqaj00ajhw_O8TnuPbs"; // Ex: "eyJhbGciOi..."
        // ==========================================

        let currentTab = 'dashboard';
        let supabaseClient = null;
        let isSimulated = false; // Real mode by default
        
        let state = {
            veiculos: [],
            abastecimentos: [],
            manutencoes: [],
            diario: [],
            checklists: []
        };

        // Função de inicialização direta (Blindada contra erros de iframes/embeds)
        function initApp() {
            try {
                // FORÇA O DESENHO IMEDIATO DA TELA (Evita a tela preta)
                render();

                // Ativando os menus de forma segura
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const tab = e.currentTarget.getAttribute('data-tab');
                        switchTab(tab);
                    });
                });

                if (AUTO_SUPABASE_URL && AUTO_SUPABASE_KEY) {
                    initSupabase(AUTO_SUPABASE_URL, AUTO_SUPABASE_KEY);
                } else {
                    showNotification('Aviso: As chaves do Supabase não foram preenchidas no código (linhas 128/129). O site funcionará, mas não salvará online.', 'error');
                }
            } catch (err) {
                document.getElementById('mainContent').innerHTML = '<div class="p-8 text-red-500 font-bold">Erro fatal ao carregar a interface: ' + err.message + '</div>';
            }
        }

        function initSupabase(url, key) {
            try {
                if (!window.supabase) throw new Error("Biblioteca do Supabase não carregada.");
                supabaseClient = window.supabase.createClient(url, key);
                isSimulated = false;
                document.getElementById('dbIndicator').className = 'w-2.5 h-2.5 rounded-full bg-emerald-400';
                document.getElementById('dbIndicatorText').innerText = 'Supabase Definitivo';
                fetchAllData();
            } catch (err) {
                showNotification('Erro ao conectar no Supabase (' + err.message + '). Verifique suas credenciais.', 'error');
                render(); 
            }
        }

        async function fetchAllData() {
            if (!supabaseClient) {
                render();
                return;
            }
            try {
                // Buscas independentes: Se uma tabela não existir, não quebra as outras
                const v = await supabaseClient.from('veiculos').select('*');
                if (v && v.data) state.veiculos = v.data;

                const a = await supabaseClient.from('abastecimentos').select('*');
                if (a && a.data) state.abastecimentos = a.data;

                const m = await supabaseClient.from('manutencoes').select('*');
                if (m && m.data) state.manutencoes = m.data;

                const d = await supabaseClient.from('diario_bordo').select('*');
                if (d && d.data) state.diario = d.data;

                const c = await supabaseClient.from('checklists').select('*');
                if (c && c.data) state.checklists = c.data;

            } catch (err) {
                console.error(err);
                showNotification('Aviso de Rede: Falha ao puxar os dados. Recarregue a página.', 'error');
            } finally {
                render(); // Garante a atualização visual
            }
        }

        // Executa a inicialização imediatamente (garante funcionamento em Vercel e Iframes)
        initApp();

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.getAttribute('data-tab') === tab) {
                    btn.className = 'nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all bg-blue-600 text-white shadow-lg shadow-blue-600/30';
                } else {
                    btn.className = 'nav-btn w-full flex items-center space-x-3.5 px-4 py-3 rounded-xl font-medium text-sm transition-all text-slate-400 hover:bg-slate-800/60 hover:text-slate-200';
                }
            });
            render();
        }

        function render() {
            try {
                const titles = {
                    dashboard: 'Dashboard Operacional',
                    veiculos: 'Gerenciamento de Veículos e Viaturas',
                    diario: 'Diário de Bordo e Saídas',
                    checklist: 'Checklist de Saída de Veículos',
                    copiarPlanilha: 'Importação Rápida (Copiar e Colar)',
                    abastecimentos: 'Controle de Abastecimentos',
                    manutencoes: 'Gestão de Manutenções'
                };
                
                const titleEl = document.getElementById('pageTitle');
                if (titleEl) titleEl.innerText = titles[currentTab] || 'Gestão de Frota';
                
                const btnContainer = document.getElementById('actionButtonContainer');
                if (btnContainer) {
                    if (['veiculos', 'abastecimentos', 'manutencoes', 'diario', 'checklist'].includes(currentTab)) {
                        const labels = { veiculos: 'Novo Veículo', abastecimentos: 'Novo Abastecimento', manutencoes: 'Nova Manutenção', diario: 'Registrar Saída', checklist: 'Novo Checklist' };
                        const modals = { veiculos: 'vehicle', abastecimentos: 'refuel', manutencoes: 'maintenance', diario: 'log', checklist: 'checklist' };
                        btnContainer.innerHTML = `<button onclick="openModal('${modals[currentTab]}')" class="flex items-center space-x-2 bg-blue-600 hover:bg-blue-500 text-white px-4 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-lg shadow-blue-600/30"><svg class="w-5 h-5 hidden sm:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg><span>${labels[currentTab]}</span></button>`;
                    } else {
                        btnContainer.innerHTML = '';
                    }
                }

                const content = document.getElementById('mainContent');
                if (!content) return;

                if (currentTab === 'dashboard') {
                content.innerHTML = `
                    <div class="space-y-6">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div class="bg-cardBg border border-slate-800/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                                <div>
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Veículos Cadastrados</span>
                                    <h3 class="text-4xl font-extrabold text-white mt-3">${state.veiculos.length}</h3>
                                </div>
                                <div class="mt-4 flex items-center text-xs text-emerald-400 font-medium">
                                    <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
                                    <span>Atualizado</span>
                                </div>
                            </div>
                            <div class="bg-cardBg border border-slate-800/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                                <div>
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Unidades Monitoradas</span>
                                    <h3 class="text-4xl font-extrabold text-white mt-3">${[...new Set(state.veiculos.map(v => v.unidade || 'Matriz'))].length || 1}</h3>
                                </div>
                                <div class="mt-4 text-xs text-slate-400 font-medium">Bases Operacionais Ativas</div>
                            </div>
                            <div class="bg-cardBg border border-slate-800/80 rounded-2xl p-6 shadow-xl flex flex-col justify-between">
                                <div>
                                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Status da Frota</span>
                                    <h3 class="text-4xl font-extrabold text-blue-400 mt-3">Operacional</h3>
                                </div>
                                <div class="mt-4 flex items-center text-xs text-emerald-400 font-medium">
                                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-ping"></span>
                                    <span>Sistemas Online</span>
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mt-6">
                            <div class="bg-cardBg border border-slate-800/80 rounded-2xl p-6 shadow-xl">
                                <h4 class="font-bold text-base text-white mb-4">Últimas Saídas (Diário de Bordo)</h4>
                                <div class="space-y-3">
                                    ${state.diario.length === 0 ? '<p class="text-xs text-slate-400">Nenhum registro encontrado.</p>' : state.diario.slice(0, 3).map(d => `
                                        <div class="flex items-center justify-between p-3.5 rounded-xl bg-slate-900/60 border border-slate-800">
                                            <div>
                                                <p class="font-semibold text-sm text-white">${d.placa} • <span class="text-blue-400">${d.motorista}</span></p>
                                                <p class="text-xs text-slate-400">Destino: ${d.destino} (${d.finalidade})</p>
                                            </div>
                                            <span class="text-xs font-mono text-slate-300">${d.km_saida ? Number(d.km_saida).toLocaleString() : '0'} km</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>

                            <div class="bg-cardBg border border-slate-800/80 rounded-2xl p-6 shadow-xl">
                                <h4 class="font-bold text-base text-white mb-4">Últimos Checklists de Saída</h4>
                                <div class="space-y-3">
                                    ${state.checklists.length === 0 ? '<p class="text-xs text-slate-400">Nenhum registro encontrado.</p>' : state.checklists.slice(0, 3).map(c => `
                                        <div class="flex items-center justify-between p-3.5 rounded-xl bg-slate-900/60 border border-slate-800">
                                            <div>
                                                <p class="font-semibold text-sm text-white">${c.placa} • <span class="text-emerald-400">${c.motorista}</span></p>
                                                <p class="text-xs text-slate-400">Inspeção completa realizada</p>
                                            </div>
                                            <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400">Aprovado</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>`;
            } else if (currentTab === 'veiculos') {
                content.innerHTML = `
                    <div class="bg-cardBg border border-slate-800/80 rounded-2xl shadow-xl overflow-x-auto">
                        <table class="w-full text-left border-collapse min-w-max">
                            <thead>
                                <tr class="border-b border-slate-800 bg-slate-900/60 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                    <th class="p-4">Placa</th><th class="p-4">Modelo</th><th class="p-4">Unidade</th><th class="p-4">Ano</th><th class="p-4">KM</th><th class="p-4">Status</th><th class="p-4 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/60 text-sm">
                                ${state.veiculos.length === 0 ? `<tr><td colspan="7" class="p-8 text-center text-slate-400">Nenhum veículo cadastrado no banco de dados.</td></tr>` : state.veiculos.map(v => `
                                    <tr class="hover:bg-slate-800/30">
                                        <td class="p-4 font-semibold text-white flex items-center space-x-2"><span class="w-2 h-2 rounded-full bg-blue-500"></span><span>${v.placa}</span></td>
                                        <td class="p-4 text-slate-300">${v.marca} ${v.modelo}</td>
                                        <td class="p-4 text-slate-300">${v.unidade || 'Matriz'}</td>
                                        <td class="p-4 text-slate-400">${v.ano}</td>
                                        <td class="p-4 text-slate-300 font-mono">${v.km ? Number(v.km).toLocaleString() : '0'} km</td>
                                        <td class="p-4"><span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">${v.status}</span></td>
                                        <td class="p-4 text-right space-x-2">
                                            <button onclick="editVehicle('${v.id}')" class="px-3 py-1.5 rounded-lg bg-blue-600/20 hover:bg-blue-600/40 text-blue-400 text-xs font-medium">Editar</button>
                                            <button onclick="deleteVehicle('${v.id}')" class="px-3 py-1.5 rounded-lg bg-red-600/20 hover:bg-red-600/40 text-red-400 text-xs font-medium">Excluir</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>`;
            } else if (currentTab === 'diario') {
                content.innerHTML = `
                    <div class="bg-cardBg border border-slate-800/80 rounded-2xl shadow-xl overflow-x-auto">

        async function handlePasteImport(e) {
            e.preventDefault();
            const text = document.getElementById('pasteInput').value;
            if (!text.trim()) {
                showNotification('Cole os dados da planilha antes de salvar.', 'error');
                return;
            }
            const lines = text.trim().split('\n');
            let count = 0;
            const newItems = [];
            lines.forEach(line => {
                const parts = line.split(/[\t,;]/);
                if (parts.length >= 1 && parts[0].trim()) {
                    newItems.push({
                        placa: parts[0].trim().toUpperCase(),
                        modelo: parts[1] ? parts[1].trim() : 'Genérico',
                        marca: parts[2] ? parts[2].trim() : 'Diversos',
                        unidade: parts[3] ? parts[3].trim() : 'Matriz',
                        status: 'Disponível',
                        ano: 2024,
                        km: 1000
                    });
                    count++;
                }
            });

            if (count === 0) {
                showNotification('Nenhum dado válido encontrado.', 'error');
                return;
            }

            if (supabaseClient) {
                const { error } = await supabaseClient.from('veiculos').insert(newItems);
                if (error) {
                    showNotification('Erro ao salvar no Supabase: ' + error.message, 'error');
                    return;
                }
                fetchAllData();
            } else {
                showNotification('Conecte ao Supabase primeiro.', 'error');
                return;
            }

            document.getElementById('pasteInput').value = '';
            showNotification(`${count} veículos incluídos e salvos no Supabase com sucesso!`);
        }

        async function submitVehicle(e, editId = '') {
            e.preventDefault();
            const item = {
                placa: document.getElementById('vPlaca').value.toUpperCase(),
                modelo: document.getElementById('vModelo').value,
                marca: document.getElementById('vMarca').value,
                unidade: document.getElementById('vUnidade').value,
                status: 'Disponível',
                ano: 2024,
                km: 1000
            };
            if (supabaseClient) {
                if (editId) {
                    const { error } = await supabaseClient.from('veiculos').update(item).eq('id', editId);
                    if (error) {
                        showNotification('Permissão negada ou erro no Supabase (Verifique o RLS). Detalhe: ' + error.message, 'error');
                        return;
                    }
                } else {
                    const { error } = await supabaseClient.from('veiculos').insert([item]);
                    if (error) {
                        showNotification('Permissão negada ou erro no Supabase (Verifique o RLS). Detalhe: ' + error.message, 'error');
                        return;
                    }
                }
                await fetchAllData();
            } else {
                showNotification('Você precisa inserir suas chaves AUTO_SUPABASE_URL e KEY no código fonte.', 'error');
                return;
            }
            closeModal();
            showNotification(editId ? 'Veículo atualizado no Supabase!' : 'Veículo salvo definitivamente no Supabase!', 'success');
        }

                observacoes: 'Tudo OK',
                data: new Date().toISOString().split('T')[0]
            };
            if (supabaseClient) {
                const { error } = await supabaseClient.from('checklists').insert([item]);
                if (error) {
                    showNotification('Erro ao salvar checklist: ' + error.message, 'error');
                    return;
                }
                fetchAllData();
            }
            closeModal();
            showNotification('Checklist salvo definitivamente no Supabase!', 'success');
        }
    </script>
</body>
</html>
